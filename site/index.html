<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leo Chai</title>
    <meta name="description" content="Leo Chai — projects, demos, and what I've been building." />
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b0e14;
        color: #e6e6e6;
      }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
      p { color: #9aa4b2; margin: 0.25rem 0; }
      a { color: #6ea8fe; }
    </style>
  </head>
  <body>
      <main>
        <h1>Leo Chai</h1>
        <p>Building things. Demos coming soon.</p>
        <div id="posts"><p>loading posts…</p></div>
        <p><a href="https://api.leochai.com/docs">api.leochai.com — live API demo</a></p>
        <p><a href="mailto:contact@leochai.com">contact@leochai.com</a></p>
      </main>
      <script>
        fetch("https://api.leochai.com/api/posts")
          .then((r) => r.json())
          .then((posts) => {
            document.getElementById("posts").innerHTML = posts.length
              ? posts.map((p) => `<p><strong>${p.title}</strong></p>`).join("")
              : "<p>no posts yet</p>";
          })
          .catch(() => {
            document.getElementById("posts").innerHTML = "<p>API unreachable</p>";
          });
      </script>
  </body>
</html>
